
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050816">
    <title>NEBULA: LAST STAND</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">

        <header class="top-bar">
            <h1>🚀 NEBULA</h1>
            <p>LAST STAND</p>
        </header>

        <div class="game-hud">
            <div class="hud-item">
                <span>SCORE</span>
                <strong id="score">000000</strong>
            </div>
            <div class="hud-item">
                <span>HEALTH</span>
                <strong id="health">100%</strong>
            </div>
            <div class="hud-item">
                <span>LEVEL</span>
                <strong id="level">01</strong>
            </div>
            <div class="hud-item">
                <span>LIVES</span>
                <strong id="lives">3</strong>
            </div>
            <div class="hud-item">
                <span>BEST SCORE</span>
                <strong id="bestScore">000000</strong>
            </div>
            <div class="hud-item pause-item">
                <button id="pauseBtn" type="button">PAUSE</button>
            </div>
        </div>

        <main class="game-area" id="gameArea">
            <canvas id="gameCanvas"></canvas>

            <div class="control-mode">
                <span>CONTROLS</span>
                <button id="joystickModeBtn" class="mode-btn active" type="button">JOYSTICK</button>
                <button id="buttonModeBtn" class="mode-btn" type="button">BUTTONS</button>
            </div>

            <div class="mobile-controls" id="mobileControls">
                <div class="joystick-zone" id="joystickZone">
                    <div class="joystick-base">
                        <div class="joystick-knob" id="joystickKnob"></div>
                    </div>
                </div>

                <div class="direction-buttons" id="directionButtons">
                    <button class="touch-btn direction-btn" id="leftBtn" type="button">◀</button>
                    <button class="touch-btn direction-btn" id="rightBtn" type="button">▶</button>
                </div>

                <button class="touch-btn fire-btn" id="fireBtn" type="button">
                    FIRE
                </button>
            </div>

            <div class="game-overlay" id="overlay">
                <div class="menu-content">
                    <h2 id="overlayTitle">NEBULA: LAST STAND</h2>
                    <p id="overlayText">
                        The galaxy needs a hero.
                        Are you ready, pilot?
                    </p>
                    <button id="startBtn" type="button">START MISSION</button>
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <span>WASD / ARROW KEYS : MOVE</span>
            <span>SPACE : SHOOT</span>
            <span>© 2026 NEBULA STUDIOS</span>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
